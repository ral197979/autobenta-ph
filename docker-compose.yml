version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autobenta
      POSTGRES_USER: autobenta
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autobenta"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://autobenta:devpassword@db:5432/autobenta
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_EXPIRES_IN: "7d"
      FRONTEND_URL: http://localhost:3001
      AI_MODE: mock
      LOG_LEVEL: info
      PORT: "3001"
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
