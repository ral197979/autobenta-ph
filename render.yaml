databases:
  - name: autobenta-postgres
    databaseName: autobenta
    postgresMajorVersion: 16
    plan: free

services:
  # ── Backend API (Node/Express + Prisma) ─────────────────────────────────────
  - type: web
    name: autobenta-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: autobenta-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: PORT
        value: "3001"
      - key: FRONTEND_URL
        value: "https://autobenta-web.onrender.com"
      - key: AI_MODE
        value: mock
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: LOG_LEVEL
        value: info

  # ── Frontend (React/Vite static site) ───────────────────────────────────────
  - type: web
    name: autobenta-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://autobenta-api.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
