databases:
  - name: autobenta-postgres
    databaseName: autobenta
    postgresMajorVersion: 16

services:
  # Single fullstack service: Express serves both the API and the built React frontend.
  # Build step: build the frontend first, copy dist/ into backend/public/, then install backend.
  # Start step: run Prisma migrations, then start Express.
  - type: web
    name: autobenta-api
    runtime: node
    plan: starter
    buildCommand: >-
      npm install &&
      npm --workspace=frontend run build &&
      mkdir -p backend/public && cp -r frontend/dist/. backend/public &&
      cd backend && npx prisma generate
    startCommand: cd backend && npx prisma migrate deploy && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: autobenta-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: FRONTEND_URL
        value: "https://autobenta-api.onrender.com"
      - key: AI_MODE
        value: mock
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: LOG_LEVEL
        value: info
