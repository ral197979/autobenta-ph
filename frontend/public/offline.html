<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — AutoBenta PH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #0B1220;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
    }
    .icon { font-size: 3rem; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    p { color: rgba(255,255,255,0.6); font-size: 0.95rem; max-width: 320px; line-height: 1.6; }
    a {
      margin-top: 0.5rem;
      display: inline-block;
      background: #2563EB;
      color: #fff;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.65rem 1.5rem;
      border-radius: 0.75rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="icon">🚗</div>
  <h1>You're offline</h1>
  <p>Check your internet connection and try again. Your saved searches are still available.</p>
  <a href="/" onclick="window.location.reload()">Try again</a>
</body>
</html>
